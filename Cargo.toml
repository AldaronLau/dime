[package]
name = "dime"
version = "0.2.0"
edition = "2024"
description = "Daku time types"
license = "Apache-2.0 OR BSL-1.0 OR MIT"
documentation = "https://docs.rs/dime"
homepage = "https://github.com/AldaronLau/dime/releases"
repository = "https://github.com/AldaronLau/dime"
readme = "README.md"
keywords = ["daku", "time", "types"]
categories = ["date-and-time", "data-structures", "no-std", "no-std::no-alloc"]
include = [
    "/LICENSE_APACHE",
    "/LICENSE_BOOST",
    "/LICENSE_MIT",
    "/README.md",
    "/src/*",
    "/examples/*",
]
rust-version = "1.85"

[dependencies.ranch]
version = "0.5.0"
